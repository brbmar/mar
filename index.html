<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>mar</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #000000;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --fg: #ffffff;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg) url("images/background.jpg") center / cover no-repeat;
    transition: background-color 0.3s ease;
  }
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }
  .logo {
    position: fixed;
    z-index: 1;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 10%;
    display: block;
  }
  .logo svg {
    display: block;
    width: 100%;
    height: auto;
    fill: var(--fg);
    transition: fill 0.3s ease;
  }
  @media (max-width: 640px) {
    .logo {
      width: 20%;
    }
  }
</style>
</head>
